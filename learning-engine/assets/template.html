<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{PROJECT}} · 读本</title>
<style>
/* ══════════════════════════════════════════════════════════════
   技术手册
   一本书：左侧全文目录，右侧正文。
   暖纸 + 墨黑 + 朱红。发丝线，无阴影，无圆角。
   ══════════════════════════════════════════════════════════════ */

:root{
  --paper:#FDFCF9;
  --paper-2:#F7F4EC;
  --paper-3:#EFEBE0;

  --ink:#1C1917;
  --ink-2:#44403C;
  --ink-3:#78716C;
  --ink-4:#A8A29E;

  --rule:rgba(28,25,23,.14);
  --rule-2:rgba(28,25,23,.07);

  --accent:#B4371F;
  --accent-2:rgba(180,55,31,.07);
  --accent-3:rgba(180,55,31,.22);

  --ok:#4A6741;

  --read-size:17px;   /* 可由顶栏 A−/A+ 调整 */
  --serif:"Songti SC","STSong","Source Han Serif SC","Noto Serif CJK SC","Iowan Old Style",Georgia,serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}

body{
  text-spacing-trim:space-all;   /* 中文标点挤压（Safari/Chrome 121+） */
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:17px;
  line-height:1.95;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  overflow:hidden;
}

button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
code,kbd,pre{font-family:var(--mono);font-variant-ligatures:none}

/* ══ 布局 ══ */
#app{
  display:flex;
  height:100vh;
}

/* ══════════════════════════════════════════════════════════════
   左侧：全文目录
   ══════════════════════════════════════════════════════════════ */
#toc{
  flex:0 0 254px;
  width:254px;
  display:flex;flex-direction:column;
  border-right:1px solid var(--rule);
  background:var(--paper);
}

#toc .head{
  flex:0 0 auto;
  padding:22px 20px 18px;
  border-bottom:1px solid var(--rule-2);
}
#toc .head .t{
  font-family:var(--serif);
  font-size:17px;font-weight:600;
  letter-spacing:.01em;
  display:flex;align-items:baseline;gap:8px;
}
#toc .head .t:hover{color:var(--accent)}
#toc .head .v{
  font-family:var(--mono);font-size:9.5px;
  color:var(--ink-4);
  letter-spacing:.02em;
  margin-top:5px;
  line-height:1.6;
}

#toc .list{
  flex:1;overflow-y:auto;
  padding:10px 0 20px;
  scrollbar-width:thin;
}
#toc .list::-webkit-scrollbar{width:7px}
#toc .list::-webkit-scrollbar-thumb{
  background:rgba(28,25,23,.12);
  border:2px solid transparent;background-clip:content-box;
}

/* 章 */
.ch{
  display:flex;align-items:baseline;gap:9px;
  width:100%;text-align:left;
  padding:8px 20px 8px 18px;
  border-left:2px solid transparent;
  transition:background .14s,color .14s;
}
.ch:hover{background:var(--paper-2)}
.ch .n{
  font-family:var(--mono);font-size:9.5px;
  color:var(--ink-4);
  flex:0 0 auto;
  letter-spacing:.04em;
  padding-top:2px;
}
.ch .t{
  flex:1;
  font-size:13.5px;
  line-height:1.5;
  color:var(--ink-2);
  transition:color .14s;
}
.ch .c{
  font-family:var(--mono);font-size:9px;
  color:var(--ink-4);
  flex:0 0 auto;
  padding-top:2px;
}
.ch:hover .t{color:var(--ink)}

/* 当前章 */
.ch.cur{
  border-left-color:var(--accent);
  background:var(--paper-2);
}
.ch.cur .n{color:var(--accent)}
.ch.cur .t{color:var(--ink);font-weight:600}

/* 已读完的章 */
.ch.done .t{color:var(--ink-3)}

/* 节 */
.secs{list-style:none;margin:0 0 6px}
.sc{
  display:flex;align-items:baseline;gap:8px;
  width:100%;text-align:left;
  padding:5px 20px 5px 38px;
  border-left:2px solid transparent;
  transition:background .14s,color .14s;
}
.sc:hover{background:var(--paper-2)}
.sc .n{
  font-family:var(--mono);font-size:9px;
  color:var(--ink-4);
  flex:0 0 auto;
  padding-top:2px;
}
.sc .t{
  flex:1;
  font-size:12.5px;
  line-height:1.55;
  color:var(--ink-3);
  transition:color .14s;
}
.sc:hover .t{color:var(--ink-2)}

/* 当前节 */
.sc.cur{
  border-left-color:var(--accent);
  background:var(--paper-2);
}
.sc.cur .n{color:var(--accent)}
.sc.cur .t{color:var(--ink);font-weight:500}

/* 读过 */
.sc.read .n::after{
  content:"";
}

#toc .foot{
  flex:0 0 auto;
  height:56px;
  display:flex;align-items:center;
  padding:0 14px;
  border-top:1px solid var(--rule-2);
}
#toc .look{
  display:flex;align-items:center;gap:8px;
  width:100%;
  padding:8px 11px;
  border:1px solid var(--rule);
  font-size:12.5px;
  color:var(--ink-2);
  transition:.16s;
}
#toc .look:hover{border-color:var(--ink-4);color:var(--ink)}
#toc .look .k{
  margin-left:auto;
  font-family:var(--mono);font-size:9.5px;
  color:var(--ink-4);
  padding:1px 4px;
  border:1px solid var(--rule-2);
}

/* ══════════════════════════════════════════════════════════════
   右侧：正文
   ══════════════════════════════════════════════════════════════ */
#stage{
  flex:1;min-width:0;
  display:flex;flex-direction:column;
  position:relative;
}

/* ── 正文顶栏 ── */
#bar{
  flex:0 0 auto;
  height:50px;
  display:flex;align-items:center;gap:0;
  padding:0 32px 0 44px;
  border-bottom:1px solid var(--rule-2);
  background:rgba(253,252,249,.92);
  backdrop-filter:blur(8px);
  z-index:8;
}

#bar .bar-sp{flex:1;min-width:14px}

#menu{
  display:none;
  font-size:14px;
  color:var(--ink-2);
  padding:6px 9px;
  margin-right:6px;
  border:1px solid var(--rule);
  line-height:1;
}

/* 面包屑 */
#crumb{
  display:flex;align-items:center;
  min-width:0;
  font-size:12.5px;
}
#crumb button{
  display:flex;align-items:center;gap:7px;
  padding:5px 8px;
  border-radius:2px;
  max-width:260px;
  color:var(--ink-3);
  transition:color .14s,background .14s;
}
#crumb > button:first-child{padding-left:0}
#crumb > button:first-child:hover{background:none}
#crumb button:hover{color:var(--accent);background:var(--paper-2)}
#crumb .cn{
  font-family:var(--mono);font-size:9.5px;
  color:var(--ink-4);
  flex:0 0 auto;
  letter-spacing:.04em;
}
#crumb button:hover .cn{color:var(--accent)}
#crumb .ct{
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
#crumb .cur{color:var(--ink);font-weight:500}
#crumb .cur .cn{color:var(--accent)}
#crumb .sep{
  color:var(--ink-4);font-size:10px;
  flex:0 0 auto;
  padding:0 1px;
  opacity:.6;
}

/* 右侧：进度 + 字号 */
#barMeta{
  font-family:var(--mono);font-size:10.5px;
  color:var(--ink-4);
  letter-spacing:.04em;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
  margin-right:14px;
}

#fontCtl{display:flex;gap:1px}
#fontCtl button{
  font-family:var(--mono);font-size:10px;
  color:var(--ink-4);
  padding:4px 7px;
  border:1px solid var(--rule-2);
  transition:.14s;
  line-height:1.4;
}
#fontCtl button:hover{color:var(--ink-2);border-color:var(--rule);background:var(--paper-2)}
#fontCtl button:disabled{opacity:.3;cursor:default}

#main{
  flex:1;min-height:0;
  overflow-y:auto;overscroll-behavior:contain;
  scroll-behavior:smooth;
}
#main::-webkit-scrollbar{width:11px}
#main::-webkit-scrollbar-thumb{
  background:rgba(28,25,23,.13);
  border:4px solid transparent;background-clip:content-box;
}
#main::-webkit-scrollbar-thumb:hover{background:rgba(28,25,23,.22);background-clip:content-box}

.screen{display:none}
.screen.on{display:block}

/* ══════════════════════════════════════════════════════════════
   章首页
   ══════════════════════════════════════════════════════════════ */
.opener{
  position:relative;
  max-width:788px;
  padding:72px 44px 80px;
  overflow:hidden;
}

.opener .ghost{
  position:absolute;
  top:64px;right:44px;
  font-family:var(--serif);
  font-size:clamp(120px,14vw,168px);
  line-height:.8;
  font-weight:700;
  color:rgba(28,25,23,.045);
  letter-spacing:-.05em;
  pointer-events:none;
  user-select:none;
}

.opener .kicker{
  font-family:var(--mono);font-size:10px;
  letter-spacing:.26em;text-transform:uppercase;
  color:var(--accent);
  margin-bottom:28px;
  position:relative;
}

.opener h1{
  position:relative;
  font-family:var(--serif);
  font-size:clamp(36px,3.8vw,50px);
  line-height:1.2;font-weight:700;
  letter-spacing:-.012em;
  margin-bottom:22px;
}

.opener .abs{
  position:relative;
  font-size:18px;line-height:1.9;
  color:var(--ink-2);
  max-width:560px;
  padding-bottom:38px;
  border-bottom:1px solid var(--rule);
  margin-bottom:38px;
}

.opener .mini-label{
  font-family:var(--mono);font-size:10px;
  letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink-4);
  margin-bottom:14px;
}

.mini-toc{list-style:none;position:relative}
.mini-toc button{
  display:grid;
  grid-template-columns:28px 1fr auto;
  gap:0 12px;align-items:baseline;
  width:100%;text-align:left;
  padding:11px 0;
  border-bottom:1px solid var(--rule-2);
  transition:padding-left .2s;
}
.mini-toc button:hover{padding-left:8px}
.mini-toc .n{
  font-family:var(--mono);font-size:10.5px;
  color:var(--ink-4);
}
.mini-toc button:hover .n{color:var(--accent)}
.mini-toc .t{
  font-size:15.5px;line-height:1.6;
  color:var(--ink-2);
  transition:color .15s;
}
.mini-toc button:hover .t{color:var(--ink)}
.mini-toc .r{
  font-family:var(--mono);font-size:9.5px;
  color:var(--ink-4);
}

/* ══════════════════════════════════════════════════════════════
   正文页
   ══════════════════════════════════════════════════════════════ */
.page{
  display:grid;
  grid-template-columns:minmax(0,640px) 164px;
  gap:0 48px;
  justify-content:start;
  max-width:1000px;
  padding:64px 44px 110px;
}

/* 右侧边注：本页依据 */
.notes{grid-column:2;position:relative}
.notes .stick{position:sticky;top:34px}
.notes .head{
  font-family:var(--mono);font-size:9px;
  letter-spacing:.14em;
  color:var(--ink-4);
  padding-bottom:7px;
  border-bottom:1px solid var(--rule-2);
  margin-bottom:10px;
}
.note{
  margin-bottom:13px;
  font-size:11px;line-height:1.6;
  color:var(--ink-3);
}
.note .n{
  display:inline-block;
  font-family:var(--mono);font-size:9px;
  color:var(--accent);
  margin-right:5px;
}
.note .k{
  display:inline-block;
  font-family:var(--mono);font-size:8px;
  letter-spacing:.08em;
  color:var(--ink-4);
  border:1px solid var(--rule-2);
  padding:0 3px;
  margin-bottom:3px;
}
.note .k.run{color:var(--ok);border-color:rgba(74,103,65,.3)}
.note code{
  display:block;
  font-size:10px;line-height:1.55;
  color:var(--ink-2);
  word-break:break-all;
  margin-top:3px;
}
.note a{color:inherit;text-decoration:none;border-bottom:1px solid var(--rule)}
.note a:hover{color:var(--accent);border-bottom-color:var(--accent-3)}
.note .why{
  display:block;
  font-style:italic;
  color:var(--ink-4);
  margin-top:2px;
}
.notes .empty{font-size:11px;color:var(--ink-4);line-height:1.7}

/* 正文列 */
.content{grid-column:1;min-width:0}

.running{
  display:flex;align-items:baseline;gap:10px;
  font-family:var(--mono);font-size:9.5px;
  letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-4);
  margin-bottom:16px;
}
.running::after{content:"";flex:1;height:1px;background:var(--rule-2)}

.content h2{
  font-family:var(--serif);
  font-size:clamp(28px,3.2vw,38px);
  line-height:1.28;font-weight:700;
  letter-spacing:-.015em;
  margin-bottom:24px;
  overflow-wrap:break-word;
  text-wrap:balance;
}

.lead{
  font-size:calc(var(--read-size) + 2px);line-height:1.8;
  color:var(--ink-2);
  margin-bottom:32px;
  padding-bottom:30px;
  border-bottom:1px solid var(--rule);
}
.lead strong{color:var(--ink);font-weight:600}
.lead em{font-style:normal;color:var(--accent)}

.content p{
  font-size:var(--read-size);line-height:1.95;
  color:var(--ink-2);
  margin-bottom:1.15em;
}
.content p strong{color:var(--ink);font-weight:600}
.content p em{font-style:normal;color:var(--accent);font-weight:500}

.content h3{
  font-size:19px;font-weight:600;
  color:var(--ink);
  margin:44px 0 15px;
  padding-bottom:8px;
  border-bottom:1px solid var(--rule-2);
}

.content p code,
.content li code,
.lead code{
  font-size:calc(var(--read-size) - 2.5px);
  color:var(--accent);
  background:var(--accent-2);
  padding:1px 5px;
  /* 让长参数名能断，但不切碎单词 */
  overflow-wrap:break-word;
  word-break:break-all;
  /* 断行时保留内边距，看起来像一整块 */
  box-decoration-break:clone;
  -webkit-box-decoration-break:clone;
}

/* 长英文串、URL、路径不撑破正文 */
.content p,
.content li,
.lead{
  overflow-wrap:break-word;
  word-break:normal;
  /* 中文长句优先在标点后断 */
  line-break:strict;
}

/* 纯文本里的 URL：允许在斜杠后断，不切单词 */
.content p:has(> a[href]),
.content a[href]{
  overflow-wrap:anywhere;
}

.content ul{list-style:none;margin:0 0 1.2em}
.content ul li{
  position:relative;
  padding-left:22px;
  font-size:var(--read-size);line-height:1.9;
  color:var(--ink-2);
  margin-bottom:11px;
  text-indent:0;
}
.content ul li::before{
  content:"";
  position:absolute;left:2px;top:.92em;
  width:7px;height:1px;background:var(--ink-4);
}

.content ol{list-style:none;margin:0 0 1.2em;counter-reset:n}
.content ol li{
  counter-increment:n;
  position:relative;
  padding-left:34px;
  font-size:var(--read-size);line-height:1.85;
  color:var(--ink-2);
  margin-bottom:16px;
}
.content ol li::before{
  content:counter(n,decimal-leading-zero);
  position:absolute;left:0;top:.12em;
  font-family:var(--mono);font-size:11px;
  color:var(--accent);
}

/* 代码 */
.codeWrap{position:relative;margin:0 0 1.5em;min-width:0;max-width:100%}
.codeWrap .lang{
  position:absolute;top:0;right:0;
  font-family:var(--mono);font-size:8.5px;
  letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-4);
  padding:2px 7px;
  background:var(--paper-2);
  border-left:1px solid var(--rule-2);
  border-bottom:1px solid var(--rule-2);
  z-index:2;
}
pre{
  margin:0;
  background:var(--paper-2);
  border-left:2px solid var(--rule);
  padding:18px 20px;
  overflow-x:auto;
  overflow-y:hidden;
  -webkit-overflow-scrolling:touch;
  font-size:13px;line-height:1.85;
  color:var(--ink-2);
  width:100%;
  max-width:100%;
  min-width:0;
  tab-size:2;
}

/* 代码块滚动条：细，不打断视觉 */
pre::-webkit-scrollbar{height:7px}
pre::-webkit-scrollbar-track{background:transparent}
pre::-webkit-scrollbar-thumb{
  background:rgba(28,25,23,.18);
  border-radius:0;
}
pre::-webkit-scrollbar-thumb:hover{background:rgba(28,25,23,.3)}
pre::-webkit-scrollbar{height:6px}
pre::-webkit-scrollbar-thumb{background:rgba(28,25,23,.16)}
pre code{white-space:pre;background:none;padding:0;font-size:inherit;color:inherit}
pre[data-copy]{position:relative;cursor:pointer;transition:background .15s}
pre[data-copy]:hover{background:var(--paper-3)}
pre[data-copy]::after{
  content:"复制";
  position:absolute;bottom:8px;right:11px;
  font-family:var(--sans);font-size:10px;
  color:var(--ink-4);
  opacity:0;transition:opacity .15s;
}
pre[data-copy]:hover::after{opacity:1}
pre.copied::after{content:"已复制";color:var(--ok);opacity:1}

.tk-c{color:#8C8676;font-style:italic}
.tk-k{color:#8A4B1F;font-weight:600}
.tk-s{color:#3F6A4A}
.tk-f{color:var(--accent);font-weight:600}
.tk-n{color:#2F4C74}
.tk-a{color:var(--accent)}

/* 旁注 */
.aside{
  position:relative;
  margin:0 0 1.6em;
  padding:19px 21px;
  background:var(--paper-2);
  border-left:2px solid var(--ink);
  font-size:15.5px;line-height:1.9;
  color:var(--ink-2);
}
.aside .lbl{
  display:block;
  font-family:var(--mono);font-size:9px;
  letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-3);
  margin-bottom:7px;
}
.aside b{color:var(--ink);font-weight:600}
.aside.warn{background:#FAF2EE;border-left-color:var(--accent)}
.aside.warn .lbl{color:var(--accent)}
.aside.warn b{color:var(--accent)}

/* 表格 */
.tbl{margin:0 0 1.6em;overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:14.5px}
thead tr{border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
th{
  text-align:left;
  padding:11px 14px 11px 0;
  font-family:var(--mono);font-size:9.5px;
  letter-spacing:.12em;text-transform:uppercase;
  font-weight:400;color:var(--ink-3);
  white-space:nowrap;
}
td{
  padding:12px 14px 12px 0;
  border-bottom:1px solid var(--rule-2);
  line-height:1.75;color:var(--ink-2);
  vertical-align:top;
}
tbody tr:last-child td{border-bottom:1px solid var(--ink)}
td code,th code{
  font-size:13px;color:var(--accent);
  background:var(--accent-2);padding:1px 5px;
  overflow-wrap:anywhere;
}

/* 键值 */
.kv{margin:0 0 1.6em}
.kv .row{
  display:grid;
  grid-template-columns:minmax(0,165px) minmax(0,1fr);
  gap:0 24px;
  padding:12px 0;
  border-top:1px solid var(--rule-2);
}
.kv .row:last-child{border-bottom:1px solid var(--rule-2)}
.kv dt{
  font-family:var(--mono);font-size:13px;
  color:var(--accent);
  word-break:break-word;line-height:1.6;
}
.kv dd{font-size:15.5px;line-height:1.8;color:var(--ink-2)}

/* 双栏 */
.split{
  display:grid;grid-template-columns:1fr 1fr;
  gap:1px;background:var(--rule-2);
  border-top:1px solid var(--rule);
  border-bottom:1px solid var(--rule);
  margin:0 0 1.6em;
}
.split > div{background:var(--paper);padding:17px 19px}
.split h4{
  font-family:var(--mono);font-size:9px;
  letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:7px;font-weight:400;
}
.split p{font-size:14.5px;line-height:1.75;margin:0;color:var(--ink-2)}

/* 编号选项 */
.opts{margin:0 0 1.8em;border-top:1px solid var(--ink)}
.opt{padding:23px 0 8px;border-bottom:1px solid var(--rule-2);position:relative}
.opt:last-child{border-bottom:1px solid var(--ink)}
.opt.pick::before{
  content:"";position:absolute;left:-20px;top:25px;bottom:20px;
  width:2px;background:var(--accent);
}
.opt .h{display:flex;align-items:baseline;gap:11px;margin-bottom:9px;flex-wrap:wrap}
.opt .u{
  font-family:var(--mono);font-size:9.5px;
  letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-4);flex:0 0 auto;
}
.opt.pick .u{color:var(--accent)}
.opt .t{
  font-family:var(--serif);font-size:19px;font-weight:600;
  color:var(--ink);line-height:1.4;
}
.opt .tag{
  font-family:var(--mono);font-size:8.5px;
  letter-spacing:.1em;text-transform:uppercase;
  color:var(--paper);background:var(--accent);
  padding:2px 6px;align-self:center;
}
.opt .d{font-size:15.5px;line-height:1.85;color:var(--ink-2);margin-bottom:12px}
.opt .n{font-size:13.5px;line-height:1.75;color:var(--ink-3);margin:0 0 12px}

/* 角标 */
sup.cit{
  font-family:var(--mono);font-size:9px;
  color:var(--accent);vertical-align:3px;
  margin-left:2px;letter-spacing:0;
}

/* 窄屏页脚来源 */
.foot-src{display:none;margin-top:42px;padding-top:16px;border-top:1px solid var(--rule-2)}
.foot-src .h{
  font-family:var(--mono);font-size:9px;
  letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-4);margin-bottom:10px;
}
.foot-src ol{list-style:none;counter-reset:sc}
.foot-src li{
  counter-increment:sc;position:relative;padding-left:24px;
  font-size:11.5px;line-height:1.65;color:var(--ink-3);
  margin-bottom:8px;overflow-wrap:anywhere;
}
.foot-src li::before{
  content:counter(sc,decimal-leading-zero);
  position:absolute;left:0;top:1px;
  font-family:var(--mono);font-size:9.5px;color:var(--ink-4);
}
.foot-src code{font-size:10.5px;color:var(--ink-2);word-break:break-word}

/* ══════════════════════════════════════════════════════════════
   底栏
   ══════════════════════════════════════════════════════════════ */
#foot{
  flex:0 0 auto;
  height:56px;
  display:flex;align-items:center;gap:18px;
  padding:0 44px;
  border-top:1px solid var(--rule);
  background:rgba(253,252,249,.94);
  backdrop-filter:blur(8px);
}

#foot .nav{
  display:flex;align-items:center;gap:7px;
  font-size:13px;color:var(--ink-2);
  height:34px;padding:0 14px;
  border:1px solid var(--rule);
  transition:.16s;
}
#foot .nav:hover:not(:disabled){border-color:var(--ink-4);color:var(--ink)}
#foot .nav:disabled{opacity:.28;cursor:default}
#foot .nav .k{font-family:var(--mono);font-size:10px;color:var(--ink-4)}

#foot .mid{flex:1;display:flex;align-items:center;gap:14px;justify-content:center}
#foot .segs{display:flex;gap:2px}
#foot .segs i{width:3px;height:13px;background:var(--rule);transition:background .3s}
#foot .segs i.done{background:var(--ink-4)}
#foot .segs i.now{background:var(--accent)}
#foot .cnt{
  font-family:var(--mono);font-size:11px;
  color:var(--ink-3);font-variant-numeric:tabular-nums;letter-spacing:.04em;
}
#foot .cnt b{color:var(--ink);font-weight:500}

/* ══════════════════════════════════════════════════════════════
   查阅面板
   ══════════════════════════════════════════════════════════════ */
#look{position:fixed;inset:0;z-index:200;display:none}
#look.on{display:flex;flex-direction:column}
#look .mask{
  position:absolute;inset:0;
  background:rgba(28,25,23,.44);
  backdrop-filter:blur(6px);
}
#look .panel{
  position:relative;
  margin:9vh auto 0;
  width:min(880px,92vw);
  max-height:82vh;
  background:#FDFCF9;
  border:1px solid var(--rule);
  box-shadow:0 24px 80px rgba(28,25,23,.2);
  display:flex;flex-direction:column;
  animation:panel-in .22s cubic-bezier(.2,.7,.25,1) both;
}
@keyframes panel-in{
  from{transform:translateY(-10px);opacity:0}
  to{transform:none;opacity:1}
}

#look .head{
  flex:0 0 auto;
  display:flex;align-items:center;
  border-bottom:1px solid var(--rule);
}
#look input{
  flex:1;background:none;border:0;outline:none;
  padding:18px 22px;
  font:inherit;font-size:16px;color:var(--ink);
}
#look input::placeholder{color:var(--ink-4)}
#look .close{
  font-family:var(--mono);font-size:9.5px;
  letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-4);
  padding:8px 12px;margin-right:12px;
  border:1px solid var(--rule-2);
}
#look .close:hover{color:var(--accent);border-color:var(--accent-3)}

#look .cats{
  flex:0 0 auto;
  display:flex;flex-wrap:wrap;

}
#look .cat{
  font-family:var(--mono);font-size:10px;

  color:var(--ink-3);
  padding:11px 13px;
  border-bottom:2px solid transparent;
  transition:.14s;
}
#look .cat:hover{color:var(--ink)}
#look .cat.on{color:var(--accent);border-bottom-color:var(--accent)}
#look .cat .n{color:var(--ink-4);margin-left:5px;font-size:9px}

#look .body{flex:1;overflow-y:auto;padding:6px 22px 26px}
#look .body::-webkit-scrollbar{width:9px}
#look .body::-webkit-scrollbar-thumb{background:rgba(28,25,23,.14)}

.item{border-bottom:1px solid var(--rule-2)}
.item .btn{
  display:grid;
  grid-template-columns:minmax(0,1fr) 20px;
  grid-template-areas:"key plus" "desc plus";
  gap:3px 14px;
  align-items:start;
  width:100%;text-align:left;
  padding:13px 0;
}
.item .btn:hover .k{color:var(--accent)}
.item .k{
  grid-area:key;
  font-family:var(--mono);font-size:13.5px;
  color:var(--ink);line-height:1.5;
  word-break:break-word;transition:color .14s;
}
.item .s{

  font-size:13px;color:var(--ink-3);line-height:1.6;
}
.item .plus{
  grid-area:plus;
  font-family:var(--mono);font-size:14px;
  color:var(--ink-4);text-align:center;padding-top:1px;
}
.item.open .plus{color:var(--accent)}
.item .doc{
  display:none;
  padding:0 0 16px;
  font-size:14px;line-height:1.85;
  color:var(--ink-2);
}
.item.open .doc{display:block}
.item .doc p{margin:0 0 10px}
.item .doc p:last-child{margin-bottom:0}
.item .doc code{
  font-size:12.5px;color:var(--accent);
  background:var(--accent-2);padding:1px 5px;
}
.item .doc b{color:var(--ink);font-weight:600}
.item .doc .dt{
  font-family:var(--mono);font-size:8.5px;

  color:var(--ink-4);margin:14px 0 6px;
}
.item .doc .rkey{
  display:grid;
  grid-template-columns:minmax(120px,240px) 1fr;
  gap:4px 20px;
  padding:6px 0 6px 12px;
  border-left:1px solid var(--rule);

}
.item .doc .rkey .kn{

  color:var(--accent);word-break:break-word;
}
.item .doc .rkey .kv2{font-size:13px;color:var(--ink-2);line-height:1.7}

#look .none{
  padding:60px 20px;text-align:center;
  font-size:14px;color:var(--ink-3);line-height:2;
}

/* ══════════════════════════════════════════════════════════════
   响应式
   ══════════════════════════════════════════════════════════════ */

  }
  #mask.on{display:block}

  *,*::before,*::after{animation:none!important;transition:none!important}
  #main{scroll-behavior:auto}
}
</style>
</head>
<body>

<div id="app">
  <nav id="toc">
    <div class="head">
      <button class="t" onclick="goScreen(0)">{{PROJECT}}</button>
      <div class="v" id="tocVer"></div>
    </div>
    <div class="list" id="tocList"></div>
    <div class="foot">
      <button class="look" onclick="openLook()">
        查阅参数 <span class="k">⌘K</span>
      </button>
    </div>
  </nav>

  <div id="stage">
    <header id="bar">
      <button id="menu" onclick="toggleToc(true)" aria-label="打开目录">☰</button>
      <nav id="crumb" aria-label="当前位置"></nav>
      <span class="bar-sp"></span>
      <span id="barMeta"></span>
      <div id="fontCtl">
        <button data-size="down" title="缩小字号">A−</button>
        <button data-size="up" title="放大字号">A+</button>
      </div>
    </header>

    <div id="main">
      <section class="screen" id="screenPage"></section>
    </div>

    <footer id="foot">
      <button class="nav" id="btnPrev" onclick="nav(-1)">
        <span class="k">←</span> 上一节
      </button>
      <div class="mid">
        <div class="segs" id="segs"></div>
        <span class="cnt" id="cnt"></span>
      </div>
      <button class="nav" id="btnNext" onclick="nav(1)">
        下一节 <span class="k">→</span>
      </button>
    </footer>
  </div>
</div>

<div id="mask" onclick="toggleToc(false)"></div>

<div id="look">
  <div class="mask" onclick="closeLook()"></div>
  <div class="panel">
    <div class="head">
      <input id="lookInput" placeholder="查命令、参数、配置、概念…" autocomplete="off" spellcheck="false">
      <button class="close" onclick="closeLook()">ESC</button>
    </div>
    <div class="cats" id="lookCats"></div>
    <div class="body" id="lookBody"></div>
  </div>
</div>



<script>
/* ══════════════════════════════════════════════════════════════
   DATA
   ══════════════════════════════════════════════════════════════ */
const DATA = {{DATA}};

const SRC = DATA.sources || {};
const STAGES = DATA.stages || [];
const REF = DATA.reference || [];
const CATS = [...new Set(REF.map(x=>x.cat))];

const SLUG = DATA.slug || 'book';
const K_SEEN = SLUG + '.seen';
const K_POS = SLUG + '.pos';

/* ══════════════════════════════════════════════════════════════
   屏幕序列：封面 → (章首页 → 内容页…) × N
   ══════════════════════════════════════════════════════════════ */
const SCREENS = [{type:'cover'}];
STAGES.forEach((st,si)=>{
  SCREENS.push({type:'opener', s:si});
  st.steps.forEach((_,ii)=>SCREENS.push({type:'page', s:si, i:ii}));
});

let idx = 0;
let seen = new Set();
try{ seen = new Set(JSON.parse(localStorage.getItem(K_SEEN)||"[]")); }catch(e){}

const $ = id => document.getElementById(id);

function esc(s){
  return String(s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

/* ══════════════════════════════════════════════════════════════
   代码高亮：先用占位符，避免正则匹配到生成的标签
   ══════════════════════════════════════════════════════════════ */
function hl(code, lang){
  const isYaml = /yaml|yml/i.test(lang||"");

  return String(code).split("\n").map(line=>{
    if(/^\s*#/.test(line)){
      return `<span class="tk-c">${esc(line)}</span>`;
    }

    const slots = [];
    const put = (cls, txt) => {
      slots.push(`<span class="${cls}">${esc(txt)}</span>`);
      return `\u0000${slots.length-1}\u0000`;
    };

    let s = line;

    if(isYaml){
      s = s.replace(/^(\s*)(-\s+)?([\w.\-\/]+)(:)/,
        (m,sp,dash,key) => `${sp}${dash||""}${put("tk-k",key)}:`);
      s = s.replace(/(\s{2,})(#.*)$/, (m,sp,c) => `${sp}${put("tk-c",c)}`);
      s = s.replace(/:\s*("[^"]*")/, (m,val) => `: ${put("tk-s",val)}`);
    } else {
      s = s.replace(/(\s{2,})(#\s.*)$/, (m,sp,c) => `${sp}${put("tk-c",c)}`);
      s = s.replace(/"[^"]*"/g, m => put("tk-s", m));
      s = s.replace(/(^|\s)(--[a-zA-Z][\w-]*)/g,
        (m,sp,opt) => `${sp}${put("tk-f",opt)}`);
      s = s.replace(/(^|\s)(-[a-zA-Z])(?=\s|$)/g,
        (m,sp,opt) => `${sp}${put("tk-f",opt)}`);
      s = s.replace(/^(\s*(?:\$\s+)?)([a-zA-Z][\w.\/-]*)/,
        (m,sp,cmd) => `${sp}${put("tk-n",cmd)}`);
      s = s.replace(/[→↓]/g, m => put("tk-a", m));
    }

    s = esc(s).replace(/\u0000(\d+)\u0000/g, (m,n) => slots[+n]);
    return s;
  }).join("\n");
}

function codeBlock(c, lang){
  return `<div class="codeWrap">${lang?`<span class="lang">${esc(lang)}</span>`:""}<pre data-copy><code>${hl(c,lang)}</code></pre></div>`;
}

/* ══════════════════════════════════════════════════════════════
   块渲染
   ══════════════════════════════════════════════════════════════ */
function blockHTML(b){
  let out = "";
  switch(b.type){
    case "p":  out = `<p>${b.text}</p>`; break;
    case "h3": out = `<h3>${b.text}</h3>`; break;
    case "ul": out = `<ul>${b.items.map(x=>`<li>${x}</li>`).join("")}</ul>`; break;
    case "ol": out = `<ol>${b.items.map(x=>`<li>${x}</li>`).join("")}</ol>`; break;
    case "note": out = `<div class="aside"><span class="lbl">${b.label||"要点"}</span>${b.text}</div>`; break;
    case "warn": out = `<div class="aside warn"><span class="lbl">${b.label||"小心"}</span>${b.text}</div>`; break;
    case "code": out = codeBlock(b.code, b.lang||""); break;
    case "table":
      out = `<div class="tbl"><table><thead><tr>${b.head.map(h=>`<th>${h}</th>`).join("")}</tr></thead>`
          + `<tbody>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
      break;
    case "kv":
      out = `<dl class="kv">${b.items.map(([k,v])=>`<div class="row"><dt>${k}</dt><dd>${v}</dd></div>`).join("")}</dl>`;
      break;
    case "split":
      out = `<div class="split">${b.items.map(c=>`<div><h4>${c.h}</h4><p>${c.p}</p></div>`).join("")}</div>`;
      break;
    case "opts":
      out = `<div class="opts">` + b.items.map((o,k)=>{
        const pick = o.pick ? " pick" : "";
        const tag = o.pick ? `<span class="tag">${o.tag||"推荐"}</span>` : "";
        return `<div class="opt${pick}"><div class="h"><span class="u">${b.unit||"选项"} ${k+1}</span><span class="t">${o.title}</span>${tag}</div>`
          + (o.desc?`<p class="d">${o.desc}</p>`:"")
          + (o.code?codeBlock(o.code, o.lang||""):"")
          + (o.note?`<p class="n">${o.note}</p>`:"")
          + `</div>`;
      }).join("") + `</div>`;
      break;
    default: out = "";
  }
  return out.replace(/\{\{(\d+)\}\}/g,'<sup class="cit">$1</sup>');
}

/* ══════════════════════════════════════════════════════════════
   进度
   ══════════════════════════════════════════════════════════════ */
function pageTotal(){ return STAGES.reduce((a,s)=>a+s.steps.length,0); }
function pageRead(){ return [...seen].filter(k=>/^\d+:\d+$/.test(k)).length; }
function markSeen(si,ii){
  seen.add(si+":"+ii);
  try{ localStorage.setItem(K_SEEN, JSON.stringify([...seen])); }catch(e){}
}
function stageDone(si){
  return STAGES[si].steps.filter((_,ii)=>seen.has(si+":"+ii)).length;
}

/* ══════════════════════════════════════════════════════════════
   左目录：全文所有章，当前章展开节
   ══════════════════════════════════════════════════════════════ */
function renderToc(sc){
  // 版本行
  const ver = (DATA.version || "").trim();
  $("tocVer").textContent = ver || "";

  const box = $("tocList");
  let html = "";

  STAGES.forEach((st,si)=>{
    const done = stageDone(si);
    const full = done === st.steps.length;
    const isCur = sc.type !== "cover" && sc.s === si;
    const cls = "ch" + (isCur ? " cur" : "") + (full ? " done" : "");

    html += `<button class="${cls}" onclick="goScreen(${SCREENS.findIndex(x=>x.type==='opener'&&x.s===si)})">
      <span class="n">${String(si+1).padStart(2,"0")}</span>
      <span class="t">${esc(st.name)}</span>
      <span class="c">${st.steps.length}</span>
    </button>`;

    if(isCur){
      html += `<ul class="secs">`;
      st.steps.forEach((sp,ii)=>{
        const cur = sc.type === "page" && sc.i === ii;
        const scls = "sc" + (cur ? " cur" : "");
        html += `<li><button class="${scls}" onclick="goScreen(${SCREENS.findIndex(x=>x.type==='page'&&x.s===si&&x.i===ii)})">
          <span class="n">${String(ii+1).padStart(2,"0")}</span>
          <span class="t">${esc(sp.title)}</span>
        </button></li>`;
      });
      html += `</ul>`;
    }
  });

  box.innerHTML = html;

  // 把当前项滚进视野
  const active = box.querySelector(".sc.cur") || box.querySelector(".ch.cur");
  if(active){
    const r = active.getBoundingClientRect();
    const br = box.getBoundingClientRect();
    if(r.top < br.top + 10 || r.bottom > br.bottom - 10){
      active.scrollIntoView({block:"center"});
    }
  }
}

/* ══════════════════════════════════════════════════════════════
   封面
   ══════════════════════════════════════════════════════════════ */
function renderCover(){
  let html = `<div class="opener" style="padding-top:140px">`;

  html += `<div class="kicker">${esc(DATA.project)}</div>`;
  html += `<h1 style="font-size:clamp(44px,5.4vw,70px)">${esc(DATA.subtitle || DATA.project)}</h1>`;

  if(DATA.version){
    html += `<div style="display:inline-flex;align-items:center;gap:9px;font-family:var(--mono);font-size:11px;color:var(--ink-3);padding:7px 12px;border:1px solid var(--rule);margin-bottom:34px">
      <span style="width:5px;height:5px;background:var(--ok)"></span>${esc(DATA.version)}
    </div>`;
  }

  if(DATA.intro){
    html += `<p class="abs" style="max-width:620px">${esc(DATA.intro)}</p>`;
  }

  html += `<div class="mini-label">${STAGES.length} 章 · ${pageTotal()} 节</div>`;
  html += `<ul class="mini-toc">`;
  STAGES.forEach((st,si)=>{
    const done = stageDone(si);
    html += `<li><button onclick="goScreen(${SCREENS.findIndex(x=>x.type==='opener'&&x.s===si)})">
      <span class="n">${String(si+1).padStart(2,"0")}</span>
      <span class="t">${esc(st.name)}</span>
      <span class="r">${st.steps.length} 节${done?` · 已读 ${done}`:""}</span>
    </button></li>`;
  });
  html += `</ul>`;

  html += `</div>`;
  $("screenPage").innerHTML = html;
}

/* ══════════════════════════════════════════════════════════════
   章首页
   ══════════════════════════════════════════════════════════════ */
function renderOpener(si){
  const st = STAGES[si];
  const done = stageDone(si);

  let html = `<div class="opener">`;
  html += `<div class="ghost">${String(si+1).padStart(2,"0")}</div>`;
  html += `<div class="kicker">第 ${si+1} 章</div>`;
  html += `<h1>${esc(st.name)}</h1>`;
  if(st.desc) html += `<p class="abs">${esc(st.desc)}</p>`;

  if(done === st.steps.length){
    html += `<div style="font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ok);margin-bottom:24px">✓ 本章已读完</div>`;
  }

  html += `<div class="mini-label">本章 ${st.steps.length} 节</div>`;
  html += `<ul class="mini-toc">`;
  st.steps.forEach((sp,ii)=>{
    const target = SCREENS.findIndex(x=>x.type==='page'&&x.s===si&&x.i===ii);
    html += `<li><button onclick="goScreen(${target})">
      <span class="n">${String(ii+1).padStart(2,"0")}</span>
      <span class="t">${esc(sp.title)}</span>
      <span class="r">${seen.has(si+":"+ii)?"读过":""}</span>
    </button></li>`;
  });
  html += `</ul>`;
  html += `</div>`;

  $("screenPage").innerHTML = html;
}

/* ══════════════════════════════════════════════════════════════
   正文页
   ══════════════════════════════════════════════════════════════ */
function srcNote(key, n){
  const s = SRC[key];
  if(!s) return "";
  const kindMap = {code:"源码", doc:"文档", run:"实测"};
  const kind = kindMap[s.kind] || "源码";
  const cls = s.kind === "run" ? "k run" : "k";
  const loc = s.line ? `:${s.line}` : "";
  const label = s.path || s.href || "";
  const href = s.href || "";
  const inner = href
    ? `<a href="${esc(href)}" target="_blank" rel="noopener">${esc(label)}${loc}</a>`
    : `${esc(label)}${loc}`;
  return `<div class="note">
    <span class="n">${n}</span><span class="${cls}">${kind}</span>
    <code>${inner}</code>
    ${s.why?`<span class="why">${esc(s.why)}</span>`:""}
  </div>`;
}

function footSrcHTML(step){
  const keys = step.sources || [];
  if(!keys.length) return "";
  const items = keys.map(k=>{
    const s = SRC[k];
    if(!s) return "";
    const label = s.path || s.href || "";
    const loc = s.line ? `:${s.line}` : "";
    return `<li><code>${esc(label)}${loc}</code>${s.why?` — ${esc(s.why)}`:""}</li>`;
  }).join("");
  return `<div class="foot-src"><div class="h">本页依据</div><ol>${items}</ol></div>`;
}

function renderPage(si, ii){
  const st = STAGES[si];
  const sp = st.steps[ii];

  markSeen(si, ii);

  const firstP = sp.blocks.findIndex(b=>b.type==="p");
  const lead = firstP>=0
    ? String(sp.blocks[firstP].text).replace(/\{\{(\d+)\}\}/g,'<sup class="cit">$1</sup>')
    : "";

  const body = sp.blocks.map((b,k)=>{
    if(k===firstP) return "";
    return blockHTML(b);
  }).join("");

  const keys = sp.sources || [];
  let notes;
  if(keys.length){
    notes = `<div class="head">本页依据</div>` + keys.map((k,n)=>srcNote(k, n+1)).join("");
  } else {
    notes = `<div class="empty">本页无外部依据。</div>`;
  }

  const html = `<div class="page">
    <div class="content">
      <div class="running">${esc(st.name)}</div>
      <h2>${esc(sp.title)}</h2>
      ${lead?`<div class="lead">${lead}</div>`:""}
      ${body}
      ${footSrcHTML(sp)}
    </div>
    <aside class="notes"><div class="stick">${notes}</div></aside>
  </div>`;

  $("screenPage").innerHTML = html;
}

/* ══════════════════════════════════════════════════════════════
   导航
   ══════════════════════════════════════════════════════════════ */
function goScreen(n, keepScroll){
  if(n < 0) n = 0;
  if(n >= SCREENS.length) n = SCREENS.length-1;
  idx = n;

  const sc = SCREENS[idx];
  $("screenPage").classList.add("on");

  if(sc.type === "cover") renderCover();
  else if(sc.type === "opener") renderOpener(sc.s);
  else renderPage(sc.s, sc.i);

  renderToc(sc);
  updateChrome(sc);
  if(!keepScroll) $("main").scrollTop = 0;

  try{ localStorage.setItem(K_POS, String(idx)); }catch(e){}
}

function nav(d){ goScreen(idx + d); }

function toggleToc(open){
  $("toc").classList.toggle("open", open);
  $("mask").classList.toggle("on", open);
}

/* 字号：3 档，存 localStorage */
const SIZES = [15, 17, 19];
let sizeIdx = 1;
try{
  const v = parseInt(localStorage.getItem(SLUG + ".font"), 10);
  if(!isNaN(v) && v >= 0 && v < SIZES.length) sizeIdx = v;
}catch(e){}

function applySize(){
  document.documentElement.style.setProperty("--read-size", SIZES[sizeIdx] + "px");
  const ctl = $("fontCtl");
  if(ctl){
    ctl.querySelector('[data-size="down"]').disabled = sizeIdx === 0;
    ctl.querySelector('[data-size="up"]').disabled = sizeIdx === SIZES.length - 1;
  }
  try{ localStorage.setItem(SLUG + ".font", String(sizeIdx)); }catch(e){}
}

function changeSize(d){
  const next = sizeIdx + d;
  if(next < 0 || next >= SIZES.length) return;
  sizeIdx = next;
  applySize();
}

function renderBar(sc){
  const crumb = $("crumb");
  const meta = $("barMeta");

  if(sc.type === "cover"){
    crumb.innerHTML = `<button class="cur" onclick="goScreen(0)">
      <span class="cn">目录</span></button>`;
    meta.textContent = `${STAGES.length} 章 · ${pageTotal()} 节`;
    return;
  }

  const st = STAGES[sc.s];
  let html = `<button onclick="goScreen(0)"><span class="cn">目录</span></button>`;
  html += `<span class="sep">/</span>`;

  const openerIdx = SCREENS.findIndex(x => x.type === "opener" && x.s === sc.s);
  if(sc.type === "opener"){
    html += `<button class="cur"><span class="cn">${String(sc.s+1).padStart(2,"0")}</span>
      <span class="ct">${esc(st.name)}</span></button>`;
  } else {
    html += `<button onclick="goScreen(${openerIdx})">
      <span class="cn">${String(sc.s+1).padStart(2,"0")}</span>
      <span class="ct">${esc(st.name)}</span></button>`;
    html += `<span class="sep">/</span>`;
    html += `<button class="cur"><span class="cn">${String(sc.i+1).padStart(2,"0")}</span>
      <span class="ct">${esc(st.steps[sc.i].title)}</span></button>`;
  }
  crumb.innerHTML = html;

  if(sc.type === "opener"){
    meta.textContent = `${st.steps.length} 节`;
  } else {
    meta.textContent = `${sc.i+1} / ${st.steps.length}`;
  }
}

function updateChrome(sc){
  renderBar(sc);
  $("btnPrev").disabled = idx === 0;
  $("btnNext").disabled = idx === SCREENS.length-1;
  $("btnNext").innerHTML = idx === SCREENS.length-1
    ? `已读完 <span class="k">✓</span>`
    : `下一节 <span class="k">→</span>`;

  const segs = $("segs");
  if(sc.type === "page"){
    const st = STAGES[sc.s];
    segs.innerHTML = st.steps.map((_,k)=>{
      const cls = k < sc.i ? "done" : (k === sc.i ? "now" : "");
      return `<i class="${cls}"></i>`;
    }).join("");
    $("cnt").innerHTML = `<b>${sc.i+1}</b> / ${st.steps.length}`;
  } else if(sc.type === "opener"){
    const st = STAGES[sc.s];
    segs.innerHTML = st.steps.map((_,k)=>
      `<i class="${seen.has(sc.s+':'+k)?'done':''}"></i>`).join("");
    $("cnt").textContent = `第 ${sc.s+1} 章 · ${st.steps.length} 节`;
  } else {
    segs.innerHTML = STAGES.map((st,k)=>{
      const d = stageDone(k);
      const cls = d === st.steps.length ? "done" : (d > 0 ? "now" : "");
      return `<i class="${cls}"></i>`;
    }).join("");
    $("cnt").innerHTML = `已读 <b>${pageRead()}</b> / ${pageTotal()}`;
  }
}

/* ══════════════════════════════════════════════════════════════
   查阅面板
   ══════════════════════════════════════════════════════════════ */
let lookOpen = false;
let lookCat = null;

function openLook(){
  if(!REF.length) return;
  lookOpen = true; lookCat = null;
  $("look").classList.add("on");
  $("lookInput").value = "";
  renderLook("");
  setTimeout(()=>$("lookInput").focus(), 30);
}
function closeLook(){
  lookOpen = false;
  $("look").classList.remove("on");
}

function renderLook(q){
  const ql = (q||"").trim().toLowerCase();

  const counts = {};
  REF.forEach(it=>{
    const hit = !ql
      || it.key.toLowerCase().includes(ql)
      || (it.short||"").toLowerCase().includes(ql)
      || (it.doc||"").toLowerCase().includes(ql);
    if(hit) counts[it.cat] = (counts[it.cat]||0)+1;
  });

  let cats = `<button class="cat${lookCat===null?" on":""}" onclick="pickCat(null)">
    全部<span class="n">${Object.values(counts).reduce((a,b)=>a+b,0)}</span></button>`;
  CATS.forEach(c=>{
    cats += `<button class="cat${lookCat===c?" on":""}" onclick="pickCat('${esc(c)}')">
      ${esc(c)}<span class="n">${counts[c]||0}</span></button>`;
  });
  $("lookCats").innerHTML = cats;

  let rows;
  if(!ql){
    rows = lookCat ? REF.filter(x=>x.cat===lookCat) : REF;
  } else {
    rows = REF.map(it=>{
      const k = it.key.toLowerCase();
      let sc = 0;
      if(k===ql) sc=100;
      else if(k.startsWith(ql)) sc=80;
      else if(k.includes(ql)) sc=60;
      else if((it.short||"").toLowerCase().includes(ql)) sc=40;
      else if((it.doc||"").toLowerCase().includes(ql)) sc=20;
      return {it, sc};
    }).filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc).map(x=>x.it);
    if(lookCat) rows = rows.filter(x=>x.cat===lookCat);
  }

  if(!rows.length){
    $("lookBody").innerHTML = `<div class="none">没有匹配「${esc(q)}」。<br>换个更短的词试试。</div>`;
    return;
  }

  $("lookBody").innerHTML = rows.map(it=>{
    const label = ql ? mark(esc(it.key), ql) : esc(it.key);
    const short = ql ? mark(esc(it.short||""), ql) : esc(it.short||"");
    return `<div class="item">
      <button class="btn" onclick="this.parentElement.classList.toggle('open')">
        <span class="k">${label}</span>
        <span class="plus">+</span>
        <span class="s">${short}</span>
      </button>
      <div class="doc">${it.doc || '<p style="color:var(--ink-4)">这条只有一句话。</p>'}</div>
    </div>`;
  }).join("");
}

function pickCat(c){
  lookCat = c;
  renderLook($("lookInput").value);
  $("lookBody").scrollTop = 0;
}

function mark(html, q){
  const i = html.toLowerCase().indexOf(q);
  if(i<0) return html;
  return html.slice(0,i)
    + `<mark style="background:var(--accent-2);color:var(--accent);padding:0 1px">`
    + html.slice(i, i+q.length) + `</mark>` + html.slice(i+q.length);
}

/* ══════════════════════════════════════════════════════════════
   事件
   ══════════════════════════════════════════════════════════════ */
document.addEventListener("click", e=>{
  const pre = e.target.closest("pre[data-copy]");
  if(!pre) return;
  navigator.clipboard.writeText(pre.innerText).then(()=>{
    pre.classList.add("copied");
    setTimeout(()=>pre.classList.remove("copied"),1200);
  }).catch(()=>{});
});

document.addEventListener("keydown", e=>{
  if(lookOpen){
    if(e.key === "Escape"){ e.preventDefault(); closeLook(); }
    return;
  }
  if(e.target.tagName === "INPUT") return;

  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase() === "k"){
    e.preventDefault(); openLook(); return;
  }
  if(e.key === "/"){ e.preventDefault(); openLook(); return; }

  if(e.key === "ArrowRight"){ e.preventDefault(); nav(1); }
  else if(e.key === "ArrowLeft"){ e.preventDefault(); nav(-1); }
  else if(e.key === "Escape"){ e.preventDefault(); toggleToc(false); }
});

$("lookInput").addEventListener("input", e=>renderLook(e.target.value));

document.getElementById("fontCtl").addEventListener("click", e=>{
  const btn = e.target.closest("button[data-size]");
  if(!btn) return;
  changeSize(btn.dataset.size === "up" ? 1 : -1);
});

/* ══════════════════════════════════════════════════════════════
   启动
   ══════════════════════════════════════════════════════════════ */
(function(){
  if(!STAGES.length){
    $("screenPage").classList.add("on");
    $("screenPage").innerHTML = `<div class="opener"><div class="kicker">数据缺失</div><h1>没有内容</h1><p class="abs">DATA.stages 为空。检查注入的数据。</p></div>`;
    return;
  }

  let start = 0;
  try{
    const v = localStorage.getItem(K_POS);
    if(v !== null){
      const n = parseInt(v, 10);
      if(!isNaN(n) && n >= 0 && n < SCREENS.length) start = n;
    }
  }catch(e){}

  applySize();
  goScreen(start);
})();
</script>
