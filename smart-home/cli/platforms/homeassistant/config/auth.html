<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Assistant 配置</title>
<style>
  :root {
    --primary: #03a9f4;
    --primary-hover: #039be5;
    --text: #1f2329;
    --text-2: #5f6673;
    --text-3: #9aa0ab;
    --border: #e4e7ed;
    --success: #21a179;
    --danger: #e5484d;
    --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* 融入模态框：透明背景，无卡片包裹，内容自然铺开 */
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 40px; color: var(--text); }
  .content { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 20px; }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 13px; font-weight: 600; color: var(--text); }
  .field input { padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; outline: none; transition: border-color .15s, box-shadow .15s; background: #fff; }
  .field input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(3, 169, 244, .12); }
  .hint { font-size: 12px; color: var(--text-3); line-height: 1.6; }

  .btn { padding: 12px 28px; border: none; border-radius: 10px; background: var(--primary); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; transition: all .15s; }
  .btn:hover { background: var(--primary-hover); }
  .btn:disabled { background: #c0c4cc; cursor: not-allowed; }

  .status { font-size: 13px; min-height: 20px; }
  .status.ok { color: var(--success); }
  .status.err { color: var(--danger); }

  /* 保存成功视图 */
  .success-view { display: none; flex-direction: column; align-items: center; gap: 14px; padding: 16px 8px; }
  .success-view .check { width: 60px; height: 60px; border-radius: 50%; background: var(--success); display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(33, 161, 121, .3); }
  .success-view .check svg { width: 30px; height: 30px; fill: #fff; }
  .success-view .msg { font-size: 17px; font-weight: 700; }
  .success-view .sub { font-size: 13px; color: var(--text-3); }
</style>
</head>
<body>
  <!-- 保存成功视图 -->
  <div class="success-view" id="successView">
    <div class="check">
      <svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>
    </div>
    <div class="msg">HA 配置成功</div>
    <div class="sub">点击右上角关闭</div>
  </div>

  <!-- 配置操作视图 -->
  <div class="content" id="configContent">
    <div class="field">
      <label for="url">HA 地址</label>
      <input type="text" id="url" placeholder="http://192.168.1.100:8123">
    </div>

    <div class="field">
      <label for="token">长期访问令牌</label>
      <input type="password" id="token" placeholder="eyJhbGciOi...">
      <div class="hint">获取：HA 前端 → 左下角用户名 → 个人资料 → 长期访问令牌 → 创建</div>
    </div>

    <button class="btn" id="saveBtn">保存配置</button>
    <div class="status" id="status"></div>
  </div>

<script>
const successView = document.getElementById('successView');
const configContent = document.getElementById('configContent');
const urlEl = document.getElementById('url');
const tokenEl = document.getElementById('token');
const saveBtn = document.getElementById('saveBtn');
const statusEl = document.getElementById('status');

function setStatus(msg, cls) {
  statusEl.textContent = msg || '';
  statusEl.className = 'status' + (cls ? ' ' + cls : '');
}

async function loadConfig() {
  try {
    const res = await fetch('/api/homeassistant/config');
    const data = await res.json();
    if (data.url) urlEl.value = data.url;
    if (data.tokenMasked) {
      tokenEl.placeholder = '已配置（令牌已隐藏），留空则保持原令牌';
      tokenEl.value = '';
    }
  } catch { /* 忽略 */ }
}

function showSuccess() {
  configContent.style.display = 'none';
  successView.style.display = 'flex';
}

saveBtn.addEventListener('click', async () => {
  const url = urlEl.value.trim();
  const token = tokenEl.value.trim();
  if (!url) { setStatus('请填写 HA 地址', 'err'); return; }
  try {
    saveBtn.disabled = true;
    // 填了新 token → 先测试连接/凭证有效性，成功才保存
    if (token) {
      setStatus('正在验证连接…');
      const testRes = await fetch('/api/homeassistant/test', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url, token }),
      });
      if (!testRes.ok) throw new Error((await testRes.json()).error || '连接验证失败');
    }
    setStatus('正在保存…');
    const res = await fetch('/api/homeassistant/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url, token }),   // token 留空 = 保持原令牌（后端处理）
    });
    if (!res.ok) throw new Error((await res.json()).error || '保存失败');
    showSuccess();
  } catch (e) {
    setStatus('出错了：' + e.message, 'err');
    saveBtn.disabled = false;
  }
});

loadConfig();

// ── 上报内容高度给父框架（模态框自适应）──
function reportHeight() {
  parent.postMessage({ type: 'smart-home-resize', height: document.documentElement.scrollHeight }, '*');
}
window.addEventListener('load', reportHeight);
if (window.ResizeObserver) {
  new ResizeObserver(reportHeight).observe(document.body);
}
</script>
</body>
</html>
